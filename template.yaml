AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Task Manager REST API — Spring Boot on AWS Lambda

# ─────────────────────────────────────────────────────────────
# Global settings applied to ALL Lambda functions in this file
# ─────────────────────────────────────────────────────────────
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: java17
    Tracing: Active              # Enables X-Ray on ALL Lambda functions
    Architectures:
      - x86_64
    Environment:
      Variables:
        SPRING_PROFILES_ACTIVE: lambda
        TABLE_NAME: !Ref TaskTable
        BLOCKLIST_TABLE_NAME: !Ref TokenBlocklistTable    # Phase 2 — token revocation

# ─────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment

# ─────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────
Resources:

  # ── 1. Main Lambda Function ──────────────────────────────────
  TaskManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub task-manager-${Environment}
      Handler: com.taskmanager.task_manager_api.StreamLambdaHandler::handleRequest
      CodeUri: target/task-manager-1.0.0.jar
      Description: Task Manager REST API running on Lambda
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
        - DynamoDBCrudPolicy:                             # Phase 2 — read/write blocklist
            TableName: !Ref TokenBlocklistTable
      Events:
        # All routes protected by LambdaAuthorizer (Phase 2)
        # LambdaAuthorizer validates JWT + checks token blocklist
        # before this Lambda ever runs
        CreateTask:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/tasks
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer
        GetAllTasks:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/tasks
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer
        GetTaskById:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/tasks/{id}
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer
        UpdateTask:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/tasks/{id}
            Method: PUT
            Auth:
              Authorizer: LambdaAuthorizer
        DeleteTask:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/tasks/{id}
            Method: DELETE
            Auth:
              Authorizer: LambdaAuthorizer
        Logout:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/auth/logout
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # ── 2. Lambda Version for SnapStart ─────────────────────────
  # SnapStart takes a memory snapshot of the initialized Lambda
  # execution environment — reduces cold start from ~8s to ~1s.
  # Requires a published version — this resource creates it automatically
  # on every deploy so SnapStart always uses the latest code.
  TaskManagerFunctionVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref TaskManagerFunction
      Description: !Sub "SnapStart version - ${Environment}"

  # ── 3. Lambda Authorizer Function (Phase 2) ──────────────────
  # Separate lightweight Lambda — validates JWT + checks blocklist
  # Invoked by API Gateway BEFORE TaskManagerFunction on every request
  # Result cached 300s (5 min) per token — minimal cold start impact
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub task-manager-authorizer-${Environment}
      Handler: com.taskmanager.task_manager_api.authorizer.AuthorizerHandler::handleRequest
      CodeUri: target/task-manager-1.0.0.jar
      Description: Lambda Authorizer — validates JWT and checks token blocklist
      MemorySize: 256                                     # Smaller — no Spring Boot context
      Timeout: 10                                         # Auth should be fast
      Environment:
        Variables:
          BLOCKLIST_TABLE_NAME: !Ref TokenBlocklistTable
          COGNITO_USER_POOL_ID: !Ref TaskManagerUserPool
      Policies:
        - DynamoDBReadPolicy:                             # Read-only — only needs to check blocklist
            TableName: !Ref TokenBlocklistTable
        - XRayWriteOnlyPolicy: {}                         # Alows Authorizer to send traces

  # ── 3. API Gateway ──────────────────────────────────────────
  TaskManagerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub task-manager-api-${Environment}
      StageName: !Ref Environment
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100
          LoggingLevel: INFO
          MetricsEnabled: true
      # ── Caching DISABLED — costs ~$13-14/month ──────────────
      # CacheClusterEnabled: true
      # CacheClusterSize: "0.5"
      Auth:
        Authorizers:
          # Phase 2: Lambda Authorizer replaces Cognito Authorizer
          # Validates JWT signature + expiry + token blocklist
          # More powerful than Cognito Authorizer — supports revocation
          LambdaAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionPayloadType: TOKEN
            Identity:
              ReauthorizeEvery: 300
              Header: Authorization
        DefaultAuthorizer: LambdaAuthorizer

  # ── 4. API Gateway permission to invoke Lambda Authorizer ────
  # Without this, API Gateway can't call the AuthorizerFunction
  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AuthorizerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TaskManagerApi}/*

  # ── 5. Cognito User Pool ────────────────────────────────────
  TaskManagerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub task-manager-users-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true                    # Gap 4 — no self-registration
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  # ── 6. Cognito App Client ───────────────────────────────────
  TaskManagerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub task-manager-client-${Environment}
      UserPoolId: !Ref TaskManagerUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ── 7. API Gateway Usage Plan + Key ─────────────────────────
  TaskManagerUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - TaskManagerApiStage
    Properties:
      UsagePlanName: !Sub task-manager-usage-plan-${Environment}
      ApiStages:
        - ApiId: !Ref TaskManagerApi
          Stage: !Ref Environment
      Throttle:
        BurstLimit: 20
        RateLimit: 50
      Quota:
        Limit: 10000
        Period: MONTH

  TaskManagerApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - TaskManagerApiStage
    Properties:
      Name: !Sub task-manager-key-${Environment}
      Enabled: true

  TaskManagerUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref TaskManagerApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref TaskManagerUsagePlan

  # ── 8. Tasks DynamoDB Table ──────────────────────────────────
  TaskTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub tasks-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: userId-status-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── 9. Token Blocklist DynamoDB Table (Phase 2) ──────────────
  # Stores revoked JWT tokens until they naturally expire.
  # TTL auto-deletes entries — no manual cleanup needed.
  # Key insight: we store jti (short UUID) not the full 800-char token.
  TokenBlocklistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub token-blocklist-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenId                          # JWT 'jti' claim
          AttributeType: S
      KeySchema:
        - AttributeName: tokenId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl                                # DynamoDB auto-deletes after this epoch
        Enabled: true                                     # token-blocklist entries auto-expire

  # ── 10. CloudWatch Dashboard ─────────────────────────────────
  TaskManagerDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub task-manager-dashboard-${Environment}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Invocations & Errors",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${TaskManagerFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${TaskManagerFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${AuthorizerFunction}", {"stat": "Sum", "label": "Authorizer Invocations"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Duration (p50 / p95 / p99)",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${TaskManagerFunction}", {"stat": "p50", "label": "p50"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${TaskManagerFunction}", {"stat": "p95", "label": "p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${TaskManagerFunction}", {"stat": "p99", "label": "p99"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway Requests & 4XX/5XX Errors",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${TaskManagerApi}", {"stat": "Sum"}],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${TaskManagerApi}", {"stat": "Sum"}],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${TaskManagerApi}", {"stat": "Sum"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB Read/Write Capacity Consumed",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${TaskTable}", {"stat": "Sum"}],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${TaskTable}", {"stat": "Sum"}],
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${TokenBlocklistTable}", {"stat": "Sum", "label": "Blocklist Reads"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            }
          ]
        }

  # ── 11. CloudWatch Alarm + SNS ───────────────────────────────
  TaskManagerAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub task-manager-alarms-${Environment}

  TaskManagerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub task-manager-error-rate-${Environment}
      AlarmDescription: Triggers when Lambda error count exceeds 5 in a 5-minute window
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TaskManagerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TaskManagerAlarmTopic
      OKActions:
        - !Ref TaskManagerAlarmTopic

  # ── 12. CloudWatch Log Groups ────────────────────────────────
  TaskManagerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/task-manager-${Environment}
      RetentionInDays: 14

  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/task-manager-authorizer-${Environment}
      RetentionInDays: 14

# ─────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: Live API Gateway URL
    Value: !Sub https://${TaskManagerApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  LambdaFunctionArn:
    Description: Main Lambda function ARN
    Value: !GetAtt TaskManagerFunction.Arn

  AuthorizerFunctionArn:
    Description: Lambda Authorizer function ARN
    Value: !GetAtt AuthorizerFunction.Arn

  DynamoDBTableName:
    Description: Tasks DynamoDB table name
    Value: !Ref TaskTable

  TokenBlocklistTableName:
    Description: Token blocklist DynamoDB table name
    Value: !Ref TokenBlocklistTable

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref TaskManagerUserPool

  CognitoUserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref TaskManagerUserPoolClient

  ApiKeyId:
    Description: API Key ID
    Value: !Ref TaskManagerApiKey

  DashboardUrl:
    Description: CloudWatch Dashboard URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=task-manager-dashboard-${Environment}

  AlarmTopicArn:
    Description: SNS Topic ARN for alarm notifications
    Value: !Ref TaskManagerAlarmTopic