AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Task Manager REST API — Spring Boot on AWS Lambda (Phase 4 per-endpoint functions)

# ─────────────────────────────────────────────────────────────
# Global settings — applied to ALL Lambda functions
# ─────────────────────────────────────────────────────────────
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: java17
    Tracing: Active                                     # Phase 3 — X-Ray on all functions
    Architectures:
      - x86_64
    Environment:
      Variables:
        SPRING_PROFILES_ACTIVE: lambda
        TABLE_NAME: !Ref TaskTable
        BLOCKLIST_TABLE_NAME: !Ref TokenBlocklistTable

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Resources:

  # ── Shared policies ──────────────────────────────────────────
  # Reused across all task Lambda functions
  # ────────────────────────────────────────────────────────────

  # ── 1. GET /api/v1/tasks ────────────────────────────────────
  GetTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub task-manager-get-tasks-${Environment}
      Handler: com.taskmanager.task_manager_api.handler.GetTasksHandler::handleRequest
      CodeUri: target/task-manager-1.0.0.jar
      Description: GET /api/v1/tasks — paginated task list with GSI query
      MemorySize: 512
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
        - DynamoDBReadPolicy:
            TableName: !Ref TokenBlocklistTable
      Events:
        GetAllTasks:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/tasks
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # ── 2. GET /api/v1/tasks/{id} ────────────────────────────────
  GetTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub task-manager-get-task-${Environment}
      Handler: com.taskmanager.task_manager_api.handler.GetTaskHandler::handleRequest
      CodeUri: target/task-manager-1.0.0.jar
      Description: GET /api/v1/tasks/{id} — single task lookup
      MemorySize: 512
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
        - DynamoDBReadPolicy:
            TableName: !Ref TokenBlocklistTable
      Events:
        GetTaskById:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/tasks/{id}
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # ── 3. POST /api/v1/tasks ────────────────────────────────────
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub task-manager-create-task-${Environment}
      Handler: com.taskmanager.task_manager_api.handler.CreateTaskHandler::handleRequest
      CodeUri: target/task-manager-1.0.0.jar
      Description: POST /api/v1/tasks — create new task with XSS sanitization
      MemorySize: 512
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
        - DynamoDBReadPolicy:
            TableName: !Ref TokenBlocklistTable
      Events:
        CreateTask:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/tasks
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # ── 4. PUT /api/v1/tasks/{id} ────────────────────────────────
  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub task-manager-update-task-${Environment}
      Handler: com.taskmanager.task_manager_api.handler.UpdateTaskHandler::handleRequest
      CodeUri: target/task-manager-1.0.0.jar
      Description: PUT /api/v1/tasks/{id} — update task title/description/status
      MemorySize: 512
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
        - DynamoDBReadPolicy:
            TableName: !Ref TokenBlocklistTable
      Events:
        UpdateTask:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/tasks/{id}
            Method: PUT
            Auth:
              Authorizer: LambdaAuthorizer

  # ── 5. DELETE /api/v1/tasks/{id} ─────────────────────────────
  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub task-manager-delete-task-${Environment}
      Handler: com.taskmanager.task_manager_api.handler.DeleteTaskHandler::handleRequest
      CodeUri: target/task-manager-1.0.0.jar
      Description: DELETE /api/v1/tasks/{id} — soft delete, row retained for audit
      MemorySize: 512
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
        - DynamoDBReadPolicy:
            TableName: !Ref TokenBlocklistTable
      Events:
        DeleteTask:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/tasks/{id}
            Method: DELETE
            Auth:
              Authorizer: LambdaAuthorizer

  # ── 6. POST /api/v1/auth/logout ──────────────────────────────
  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub task-manager-logout-${Environment}
      Handler: com.taskmanager.task_manager_api.handler.LogoutHandler::handleRequest
      CodeUri: target/task-manager-1.0.0.jar
      Description: POST /api/v1/auth/logout — revokes JWT token via blocklist
      MemorySize: 256                                   # Smaller — just a DynamoDB write
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TokenBlocklistTable
      Events:
        Logout:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /api/v1/auth/logout
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # ── SnapStart Version Resources ─────────────────────────────
  # Required for SnapStart to activate — one per function.
  # SnapStart snapshots the initialized JVM state after cold start,
  # reducing subsequent cold starts from ~8s to ~1s.
  GetTasksFunctionVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref GetTasksFunction
      Description: !Sub "SnapStart - ${Environment}"

  GetTaskFunctionVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref GetTaskFunction
      Description: !Sub "SnapStart - ${Environment}"

  CreateTaskFunctionVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref CreateTaskFunction
      Description: !Sub "SnapStart - ${Environment}"

  UpdateTaskFunctionVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref UpdateTaskFunction
      Description: !Sub "SnapStart - ${Environment}"

  DeleteTaskFunctionVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref DeleteTaskFunction
      Description: !Sub "SnapStart - ${Environment}"

  LogoutFunctionVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref LogoutFunction
      Description: !Sub "SnapStart - ${Environment}"

  # ── 7. Lambda Authorizer ─────────────────────────────────────
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub task-manager-authorizer-${Environment}
      Handler: com.taskmanager.task_manager_api.authorizer.AuthorizerHandler::handleRequest
      CodeUri: target/task-manager-1.0.0.jar
      Description: Lambda Authorizer — validates JWT + checks token blocklist
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          BLOCKLIST_TABLE_NAME: !Ref TokenBlocklistTable
          COGNITO_USER_POOL_ID: !Ref TaskManagerUserPool
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TokenBlocklistTable

  # ── 8. API Gateway ───────────────────────────────────────────
  TaskManagerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub task-manager-api-${Environment}
      StageName: !Ref Environment
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100
          LoggingLevel: INFO
          MetricsEnabled: true
      Auth:
        Authorizers:
          LambdaAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionPayloadType: TOKEN
            Identity:
              ReauthorizeEvery: 60
              Header: Authorization
        DefaultAuthorizer: LambdaAuthorizer

  # ── 9. API Gateway permission to invoke Authorizer ───────────
  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AuthorizerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TaskManagerApi}/*

  # ── 10. Cognito User Pool ────────────────────────────────────
  TaskManagerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub task-manager-users-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  # ── 11. Cognito App Client ───────────────────────────────────
  TaskManagerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub task-manager-client-${Environment}
      UserPoolId: !Ref TaskManagerUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ── 12. Tasks DynamoDB Table ─────────────────────────────────
  TaskTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub tasks-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: userId-status-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── 13. Token Blocklist Table ────────────────────────────────
  TokenBlocklistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub token-blocklist-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenId
          AttributeType: S
      KeySchema:
        - AttributeName: tokenId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── 14. CloudWatch Dashboard ─────────────────────────────────
  TaskManagerDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub task-manager-dashboard-${Environment}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Invocations per endpoint",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${GetTasksFunction}", {"stat": "Sum", "label": "GET /tasks"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${GetTaskFunction}", {"stat": "Sum", "label": "GET /tasks/{id}"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${CreateTaskFunction}", {"stat": "Sum", "label": "POST /tasks"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${UpdateTaskFunction}", {"stat": "Sum", "label": "PUT /tasks/{id}"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${DeleteTaskFunction}", {"stat": "Sum", "label": "DELETE /tasks/{id}"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Duration p95 per endpoint",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${GetTasksFunction}", {"stat": "p95", "label": "GET /tasks p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${CreateTaskFunction}", {"stat": "p95", "label": "POST /tasks p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${UpdateTaskFunction}", {"stat": "p95", "label": "PUT /tasks/{id} p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${DeleteTaskFunction}", {"stat": "p95", "label": "DELETE /tasks/{id} p95"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Errors per endpoint",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${GetTasksFunction}", {"stat": "Sum", "label": "GET /tasks errors"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${CreateTaskFunction}", {"stat": "Sum", "label": "POST /tasks errors"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${UpdateTaskFunction}", {"stat": "Sum", "label": "PUT /tasks/{id} errors"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${DeleteTaskFunction}", {"stat": "Sum", "label": "DELETE /tasks/{id} errors"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB Consumed Capacity",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${TaskTable}", {"stat": "Sum"}],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${TaskTable}", {"stat": "Sum"}],
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${TokenBlocklistTable}", {"stat": "Sum", "label": "Blocklist Reads"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            }
          ]
        }

  # ── 15. CloudWatch Alarm ─────────────────────────────────────
  TaskManagerAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub task-manager-alarms-${Environment}

  TaskManagerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub task-manager-error-rate-${Environment}
      AlarmDescription: Fires when any Lambda error count exceeds 5 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TaskManagerAlarmTopic

  # ── 16. CloudWatch Log Groups ────────────────────────────────
  GetTasksLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/task-manager-get-tasks-${Environment}
      RetentionInDays: 14

  GetTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/task-manager-get-task-${Environment}
      RetentionInDays: 14

  CreateTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/task-manager-create-task-${Environment}
      RetentionInDays: 14

  UpdateTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/task-manager-update-task-${Environment}
      RetentionInDays: 14

  DeleteTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/task-manager-delete-task-${Environment}
      RetentionInDays: 14

  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/task-manager-authorizer-${Environment}
      RetentionInDays: 14

  LogoutLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/task-manager-logout-${Environment}
      RetentionInDays: 14

# ─────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: Live API Gateway URL
    Value: !Sub https://${TaskManagerApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  DynamoDBTableName:
    Description: Tasks DynamoDB table name
    Value: !Ref TaskTable

  TokenBlocklistTableName:
    Description: Token blocklist DynamoDB table name
    Value: !Ref TokenBlocklistTable

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref TaskManagerUserPool

  CognitoUserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref TaskManagerUserPoolClient

  DashboardUrl:
    Description: CloudWatch Dashboard URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=task-manager-dashboard-${Environment}

  AlarmTopicArn:
    Description: SNS Topic ARN for alarm notifications
    Value: !Ref TaskManagerAlarmTopic